name: build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  goreleaser:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.17

      - name: Build
        uses: goreleaser/goreleaser-action@v7
        with:
          version: 1.5.0
          args: release --snapshot --skip-validate --skip-publish --skip-sign
